<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda Bin</title>
  <script>try { document.documentElement.dataset.theme = localStorage.getItem("agenda-theme") || "dark"; } catch {}</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">Agenda</a>
    <nav class="nav">
      <button id="theme-toggle" type="button"></button>
      <a class="btn" href="index.html">← Back to agendas</a>
    </nav>
  </header>

  <main>
    <p class="status" id="status" hidden></p>
    <div class="section-head">
      <h1>🗑 Bin</h1>
      <button class="btn-danger" id="empty-bin">Empty bin</button>
    </div>
    <div class="bin-filter" id="filters"></div>
    <div id="bin"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="store.js"></script>
  <script>
    let filter = "all";

    const binEl = document.getElementById("bin");
    const filtersEl = document.getElementById("filters");
    const emptyBtn = document.getElementById("empty-bin");

    function fmt(ts) {
      return new Date(ts).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
    }

    function render() {
      const bin = binItems();
      const owners = [...new Set(bin.map((b) => memberName(b.member_id)))];
      if (!owners.includes(filter)) filter = "all";

      filtersEl.innerHTML = owners.length > 1
        ? ["all", ...owners].map((name) =>
            `<button class="chip ${filter === name ? "active" : ""}" data-filter="${escapeHtml(name)}">${name === "all" ? "All" : escapeHtml(name)}</button>`).join("")
        : "";

      const rows = bin.filter((b) => filter === "all" || memberName(b.member_id) === filter);
      emptyBtn.disabled = !db || bin.length === 0;

      binEl.innerHTML = rows.length
        ? `<table class="bin-table">
            <thead><tr><th>Agenda</th><th>Owner</th><th>Removed</th><th></th></tr></thead>
            <tbody>${rows.map((b) => `
              <tr data-id="${b.id}">
                <td class="text">${escapeHtml(b.text)}</td>
                <td>${escapeHtml(memberName(b.member_id))}</td>
                <td>${fmt(b.binned_at)}</td>
                <td class="actions">
                  <button class="btn-icon" data-action="restore" title="Restore to its member">↺ Restore</button>
                  <button class="btn-icon" data-action="purge" title="Delete forever">✕</button>
                </td>
              </tr>`).join("")}
            </tbody>
          </table>`
        : db ? `<p class="empty">The bin is empty. Struck-off agendas land here when you press Refresh on a member's list.</p>` : "";
    }

    filtersEl.addEventListener("click", (e) => {
      const chip = e.target.closest("[data-filter]");
      if (chip) { filter = chip.dataset.filter; render(); }
    });

    binEl.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-action]");
      if (!btn) return;
      const id = Number(btn.closest("tr").dataset.id);
      if (btn.dataset.action === "restore") actions.restore(id);
      else actions.purge(id);
    });

    emptyBtn.addEventListener("click", () => {
      if (confirm(`Permanently delete ${binItems().length} agenda(s)?`)) actions.emptyBin();
    });

    setupThemeToggle();
    connect(render);
  </script>
</body>
</html>
